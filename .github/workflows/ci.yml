# CI/CD (ADR-0004, GitFlow)
#   - push / pull request      : ruff + pylint + pytest (avec un MongoDB de test)
#   - push sur develop         : + image (test de démarrage, scan Trivy) sur GHCR + déploiement preprod
#   - GitHub Release publiée   : + image vX.Y.Z (mêmes contrôles) sur GHCR + déploiement prod
#   - push sur main            : contrôles uniquement (la prod ne part que d'une release)
#
# Configuration GitHub attendue (Settings > Environments) :
#   environnements `preprod` et `prod`, chacun avec :
#     - variable COOLIFY_APP_UUID : UUID de l'application Coolify
#   secrets du dépôt :
#     - COOLIFY_URL   : ex. https://coolify.example.com (sans / final)
#     - COOLIFY_TOKEN : token API Coolify limité au projet (droits write + deploy)

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Lint & tests
    runs-on: ubuntu-latest
    # MongoDB réel pour tester la lecture des commandes ERP (ADR-0007), même version que l'ERP.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check . --output-format github

      - name: Qualité (pylint, seuil dans pyproject.toml)
        run: uv run pylint src

      - name: Tests (pytest)
        run: uv run pytest -q

  build:
    name: Image Docker
    needs: checks
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag SHA
        id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Deux tags (ADR-0004) : le SHA du commit, et la version pour une release vX.Y.Z.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha_tag }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      # 1. Construire localement pour tester avant de publier.
      - name: Construire l'image (sans publier)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/express-delivery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. L'image démarre : migrations appliquées, base joignable (SQLite par défaut, sans modèle).
      - name: Tester le démarrage de l'image
        run: |
          docker run -d --name smoke -p 8000:8000 local/express-delivery:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health >/dev/null && break
            sleep 2
          done
          ready=$(curl -s http://localhost:8000/health/ready)
          echo "$ready"
          echo "$ready" | grep -q '"order_store":"reachable"'
          echo "$ready" | grep -q '"schema":"up_to_date"'
          docker rm -f smoke

      # 3. Sécurité : rapport complet, puis échec sur toute vulnérabilité critique corrigeable.
      - name: Scanner l'image (Trivy, rapport)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/express-delivery:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scanner l'image (Trivy, blocage sur CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/express-delivery:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # 4. Publier l'image testée (reconstruction instantanée depuis le cache).
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Déploiement ${{ github.event_name == 'release' && 'prod' || 'preprod' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'prod' || 'preprod' }}
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      IMAGE_TAG: ${{ needs.build.outputs.sha_tag }}
    steps:
      # Tant que l'application Coolify de l'environnement n'existe pas, on ne déploie pas
      # (l'image est quand même publiée sur GHCR).
      - name: Vérifier la configuration Coolify
        id: config
        run: |
          if [ -z "$APP_UUID" ]; then
            echo "::warning::COOLIFY_APP_UUID non défini pour l'environnement ${{ github.event_name == 'release' && 'prod' || 'preprod' }} : déploiement ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Coolify tire l'image publiée sans la reconstruire : on lui indique le tag
      # exact (SHA) avant de déclencher le déploiement. L'auto-deploy Coolify reste désactivé.
      - name: Pointer l'application Coolify sur l'image ${{ needs.build.outputs.sha_tag }}
        if: steps.config.outputs.ready == 'true'
        run: |
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_name\": \"${IMAGE_NAME,,}\", \"docker_registry_image_tag\": \"$IMAGE_TAG\"}" \
            "$COOLIFY_URL/api/v1/applications/$APP_UUID"

      # Coolify vérifie /health/ready et garde l'ancienne version si le démarrage échoue.
      - name: Déclencher le déploiement
        if: steps.config.outputs.ready == 'true'
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID"
