services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: livraison_express
      POSTGRES_USER: livraison
      POSTGRES_PASSWORD: ${ERP_POSTGRES_PASSWORD:?définir ERP_POSTGRES_PASSWORD (voir README-erp-databases.md)}
    ports:
      # Publié seulement en local : rien de l'ERP simulé n'est accessible depuis le réseau.
      - "127.0.0.1:${ERP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_erp_data:/var/lib/postgresql/data
      # Pas de script d'initialisation : le simulateur crée lui-même le schéma (storage.py).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livraison -d livraison_express"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    ports:
      # MongoDB sans authentification (comme l'ERP du cours) : jamais exposé hors de la machine.
      - "127.0.0.1:${ERP_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_erp_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  erp-simulator:
    build:
      context: .
      dockerfile: Dockerfile.erp-simulator
    environment:
      # Pas de mot de passe dans l'URL : psycopg (libpq) lit PGPASSWORD.
      PGPASSWORD: ${ERP_POSTGRES_PASSWORD:?définir ERP_POSTGRES_PASSWORD (voir README-erp-databases.md)}
      POSTGRES_DSN: postgresql://livraison@postgres:5432/livraison_express
      MONGO_URI: mongodb://mongodb:27017
      BATCH_SIZE: ${BATCH_SIZE:-5}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HISTORY_ORDERS: ${POSTGRES_HISTORY_ORDERS:-10000}
      RECENT_HISTORY_ORDERS: ${RECENT_HISTORY_ORDERS:-1000}
      LIVE_ORDER_LIMIT: ${LIVE_ORDER_LIMIT:-0}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  postgres_erp_data:
  mongo_erp_data:
