[project]
name = "industrialisation-ia-dans-cloud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=2.0.0",
    "fastapi>=0.142.2",
    "joblib>=1.6.0",
    "mlflow>=3.16.1",
    "psycopg[binary]>=3.3.9",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pylint>=4.1.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[tool.ruff]
# Notebooks exploratoires : hors du lint de la CI.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.flake8-bugbear]
# Injection de dépendances FastAPI : Depends() en valeur par défaut est voulu.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
