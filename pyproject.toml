[project]
name = "industrialisation-ia-dans-cloud"
version = "0.1.0"
description = "API de prédiction d'éligibilité à la livraison express (industrialisation d'un POC ML)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=2.0.0",
    "fastapi>=0.142.2",
    "mlflow-skinny==3.16.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.9",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "mlflow==3.16.1",
    "pylint>=4.1.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "seaborn>=0.13.2",
]

[tool.ruff]
# Notebooks exploratoires : hors du lint de la CI.
# Simulateur ERP : code fourni par le cours, système externe à l'application.
extend-exclude = ["*.ipynb", "erp_simulator"]

[tool.ruff.lint.flake8-bugbear]
# Injection de dépendances FastAPI : Depends() en valeur par défaut est voulu.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pylint.main]
# Garde-fou contre la régression de qualité (CI) ; à remonter progressivement.
fail-under = 8.5

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
